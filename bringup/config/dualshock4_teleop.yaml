joy_node:
  ros__parameters:
    device_id: 0
    deadzone: 0.10
    autorepeat_rate: 20.0
    sticky_buttons: false

teleop_twist_joy_node:
  ros__parameters:
    require_enable_button: true
    enable_button: 4
    enable_turbo_button: 5
    axis_linear:
      x: 1
    scale_linear:
      x: 0.30
    scale_linear_turbo:
      x: 0.60
    axis_angular:
      yaw: 3
    scale_angular:
      yaw: 0.80
    scale_angular_turbo:
      yaw: 1.20
    publish_stamped_twist: false
