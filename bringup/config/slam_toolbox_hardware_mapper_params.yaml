slam_toolbox:
  ros__parameters:

    # Solver plugin parameters.
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Hardware frame and topic contract.
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping

    debug_logging: false

    # The YDLidar X2 supplies about 11 scans/s. Process every scan so scan
    # matching receives enough overlap while the physical robot is moving.
    throttle_scans: 1
    transform_publish_period: 0.04
    map_update_interval: 0.5
    resolution: 0.05

    # Match the X2 driver while rejecting returns from the chassis immediately
    # around the sensor. Mapping beyond 5 m adds little useful indoor detail.
    min_laser_range: 0.35
    max_laser_range: 5.0
    minimum_time_interval: 0.06
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # Physical calibration showed that fused wheel/IMU odometry is more stable
    # than local X2 scan matching. The X2 produced large isolated range changes
    # even while stationary, and scan matching accumulated a false map-to-odom
    # rotation. Use odometry to place scans; LiDAR still builds the occupancy
    # grid. Scan matching can be enabled explicitly for a controlled comparison.
    use_scan_matching: false
    use_scan_barycenter: true
    minimum_travel_distance: 0.02
    minimum_travel_heading: 0.02
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.15
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 2.0
    # Allow only conservative return-to-start correction. Repetitive indoor
    # walls and sparse/noisy X2 returns require a longer chain, low variance,
    # and stronger coarse/fine responses than the generic defaults.
    do_loop_closing: true
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 1.0
    loop_match_minimum_response_coarse: 0.50
    loop_match_minimum_response_fine: 0.60

    # Correlation search parameters.
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Loop closure search parameters.
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan matcher penalties and tuning.
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.1
