xacro:
  # For a measured robot, enable the complete block below together with the
  # sensor-pose keys. Poses use chassis_link axes: x forward, y left, z up.
  # robot_mass: 8.0
  # ground_clearance: 0.08
  # wheelbase: 0.19
  # wheel_track: 0.34
  # overall_length: 0.35
  # overall_width: 0.385
  # use_chassis_mesh: false
  base_mass: 10.0
  base_width: 0.40
  base_length: 0.40
  base_height: 0.10
  wheel_mass: 0.30
  wheel_len: 0.04
  caster_wheel_mass: 0.10
  caster_wheel_radius: 0.05
  laser_pos_z: 0.10
  laser_frame_z: 0.05
  # laser_pos_x: 0.0
  # laser_pos_y: 0.0
  # laser_roll: 0.0
  # laser_pitch: 0.0
  # laser_yaw: 0.0
  # cam_pos_x: 0.0
  # cam_pos_y: 0.0
  # cam_pos_z: 0.0
  # cam_roll: 0.0
  # cam_pitch: 0.0
  # cam_yaw: 0.0
  # imu_pos_x: 0.0
  # imu_pos_y: 0.0
  # imu_pos_z: 0.0
  # imu_roll: 0.0
  # imu_pitch: 0.0
  # imu_yaw: 0.0

drive:
  wheel_layout: diff
  controller_name: robot_base_controller
  controller_type: diff_drive_controller/DiffDriveController
  wheel_radius_m: 0.05

hardware:
  can_id: 42
  motor_freq: 15600
  ticks_per_rotation: 1464
  lidar_type: tmini
  speed_scale: 0.50
  max_wheel_angular_velocity_rad_s: 20.0
  control_mode: open_loop
  wheel_radius_calibrated: false
  safety_gate:
    # -1 is deliberately unconfigured and blocks physical hardware startup.
    # Replace both values only after the documented wiring inspection.
    estop_ok_dio_channel: -1
    local_enable_dio_channel: -1
    enable_debounce_ms: 100
    safe_release_ms: 500

  # Valid indices: 0..3 for active motors, -1 for unused.
  left_front_motor: 2
  left_rear_motor: 3
  right_front_motor: 0
  right_rear_motor: 1

  invert_left_front_motor: false
  invert_left_rear_motor: false
  invert_right_front_motor: true
  invert_right_rear_motor: true

  invert_left_front_encoder: false
  invert_left_rear_encoder: false
  invert_right_front_encoder: false
  invert_right_rear_encoder: false
