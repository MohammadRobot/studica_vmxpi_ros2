name: ROS CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ros-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: ros2_ws/src/studica_vmxpi_ros2

      - name: Checkout studica_drivers dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: MohammadRobot/studica_drivers
          ref: 5a866ff2eb3164795d32d71764702bd50e4b2dfe
          path: ros2_ws/src/studica_drivers

      - name: Checkout studica_ros2_control dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: MohammadRobot/studica_ros2_control
          ref: d5f198d93d89b3863cd9b6d02cadb516b78fb3c9
          path: ros2_ws/src/studica_ros2_control

      - name: Checkout studica_robot_monitor dependency
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: MohammadRobot/studica_robot_monitor
          ref: f51a2fc0f3c1d23264bdfa7651d7f118d87eaaf2
          path: ros2_ws/src/studica_robot_monitor

      - name: Configure pinned ROS APT source
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            --output /tmp/ros2-apt-source.deb \
            https://github.com/ros-infrastructure/ros-apt-source/releases/download/1.2.0/ros2-apt-source_1.2.0.jammy_all.deb
          echo "767884cf4ed03116b9d64438930a832ed854147ae435279a7924dfdf60f94433  /tmp/ros2-apt-source.deb" \
            | sha256sum --check --strict
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get -o Acquire::Retries=3 update

      - name: Setup ROS 2 Humble
        uses: ros-tooling/setup-ros@649ef6bcd696da05bc27ceb3fab69d810c0daeab # 0.7.19
        with:
          required-ros-distributions: humble

      # GitHub's Jammy image installs libc++-dev, which selects
      # libunwind-14-dev. Nav2's Ceres/glog chain needs libunwind-dev, and the
      # two development packages conflict. Keep this runner-only workaround
      # after setup-ros in case that action restores the LLVM package.
      - name: Resolve Ubuntu runner libunwind conflict
        run: |
          if dpkg-query -W -f='${Status}\n' libunwind-14-dev 2>/dev/null \
              | grep -qx 'install ok installed'; then
            sudo apt-get remove -y libunwind-14-dev
          fi
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libunwind-dev

      - name: Install package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          sudo rosdep init 2>/dev/null || true
          rosdep update
          cd ros2_ws
          rosdep install \
            --from-paths src \
            --ignore-src \
            --rosdistro humble \
            --skip-keys "orbbec_camera ydlidar_ros2_driver" \
            -r -y

      - name: Validate classroom source and documentation
        working-directory: ros2_ws/src/studica_vmxpi_ros2
        run: ./scripts/check_project.sh

      - name: Build
        run: |
          source /opt/ros/humble/setup.bash
          cd ros2_ws
          colcon build \
            --event-handlers console_direct+ \
            --packages-select \
              studica_drivers studica_robot_monitor studica_ros2_control studica_vmxpi_ros2

      - name: Test
        run: |
          source /opt/ros/humble/setup.bash
          source ros2_ws/install/setup.bash
          cd ros2_ws
          set +e
          colcon test \
            --event-handlers console_direct+ \
            --return-code-on-test-failure \
            --packages-select \
              studica_drivers studica_robot_monitor studica_ros2_control studica_vmxpi_ros2
          test_rc=$?
          colcon test-result --verbose || true
          exit $test_rc

  headless-harmonic:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: ros2_ws/src/studica_vmxpi_ros2

      # Match the dependency preparation in build-and-test. The product
      # installer itself remains free of GitHub-runner-specific mutations.
      - name: Resolve Ubuntu runner libunwind conflict
        run: |
          if dpkg-query -W -f='${Status}\n' libunwind-14-dev 2>/dev/null \
              | grep -qx 'install ok installed'; then
            sudo apt-get remove -y libunwind-14-dev
          fi
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libunwind-dev

      - name: Install, build, and run headless Harmonic contracts
        working-directory: ros2_ws/src/studica_vmxpi_ros2
        run: ./scripts/setup_ubuntu.sh --mode simulation --non-interactive
